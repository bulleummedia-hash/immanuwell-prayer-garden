<!doctype html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>임마누웰 : 기도정원 MVP</title>
<style>
:root{--glass:rgba(20,18,15,.58);--line:rgba(255,255,255,.18);--text:#f5f1e8;--accent:#e7d7b7}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0c0d0d;color:var(--text);font-family:system-ui,-apple-system,"Pretendard","Noto Sans KR",sans-serif}button{font:inherit}#app{position:relative;width:100%;height:100%}canvas{display:block;width:100%;height:100%;touch-action:none}.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 16px 50px rgba(0,0,0,.35)}#hud{position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{pointer-events:auto;border-radius:999px;padding:11px 16px;display:flex;align-items:center;gap:10px;font-size:14px}.brand{font-weight:700}.muted{opacity:.72}.actions-top{display:flex;gap:8px}.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:#fff;pointer-events:auto}#bottomActions{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:6px;padding:7px;border-radius:999px;pointer-events:auto}.action{border:0;background:transparent;color:#fff;padding:10px 16px;border-radius:999px;min-width:82px}.action:hover,.action.active{background:rgba(255,255,255,.12)}#joystick{position:absolute;left:24px;bottom:28px;width:112px;height:112px;border-radius:50%;pointer-events:auto;touch-action:none}#joyKnob{position:absolute;left:36px;top:36px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.76);box-shadow:0 2px 18px rgba(0,0,0,.35)}#hint{position:absolute;left:50%;top:82px;transform:translateX(-50%);padding:9px 13px;border-radius:999px;font-size:13px;white-space:nowrap}.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 50% 30%,rgba(78,58,38,.24),rgba(5,7,8,.75))}.card{width:min(860px,100%);border-radius:26px;padding:28px}#selector h1{margin:0 0 8px;font-size:clamp(28px,6vw,48px);font-weight:700}#selector p{margin:0 0 24px;color:rgba(255,255,255,.7)}.choiceRow{display:grid;grid-template-columns:1fr 1fr;gap:14px}.charChoice{border:1px solid var(--line);border-radius:22px;padding:18px;background:rgba(255,255,255,.035);color:#fff;text-align:center}.charChoice.selected{outline:2px solid rgba(231,215,183,.7);background:rgba(255,255,255,.08)}.avatarPreview{height:190px;display:flex;justify-content:center;align-items:flex-end;position:relative}.head{position:absolute;top:26px;width:72px;height:72px;border-radius:50%;background:#a96f48;box-shadow:inset 0 -8px 12px rgba(0,0,0,.16)}.hair.male{position:absolute;top:18px;width:79px;height:39px;border-radius:50% 50% 35% 35%;background:#3d2a22}.hair.female{position:absolute;top:17px;width:82px;height:86px;border-radius:50% 50% 42% 42%;background:#473027}.body{position:absolute;bottom:8px;width:88px;height:100px;border-radius:40px 40px 26px 26px;background:#eee2cf}.legs{position:absolute;bottom:0;width:64px;height:32px;border-radius:0 0 22px 22px;background:#555}.paletteTitle{margin:22px 0 10px;font-size:14px;color:rgba(255,255,255,.72)}.palette{display:flex;gap:12px}.swatch{width:42px;height:42px;border:2px solid rgba(255,255,255,.24);border-radius:50%;cursor:pointer}.swatch.selected{outline:3px solid white;outline-offset:3px}.enter{margin-top:24px;width:100%;border:0;border-radius:16px;padding:15px;background:#efe5d1;color:#24201a;font-weight:800;font-size:16px}#bibleOverlay{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:rgba(3,4,4,.78);backdrop-filter:blur(8px);pointer-events:auto}.bookWrap{position:relative;width:min(900px,92vw);height:min(590px,72vh);perspective:1800px}.bookShadow{position:absolute;inset:6% 4% 0;border-radius:30px;box-shadow:0 50px 90px rgba(0,0,0,.65)}.book{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;border-radius:14px;background:#6a3f25;padding:13px;box-shadow:0 20px 70px rgba(0,0,0,.62)}.page{position:relative;background:linear-gradient(90deg,#efe5cd,#fff8e8 12%,#fbf2df 88%,#e2d4b9);color:#2c261e;padding:44px 42px 34px;overflow:hidden;box-shadow:inset 0 0 22px rgba(84,59,29,.13)}.page.left{border-radius:8px 3px 3px 8px;border-right:1px solid #b8a789}.page.right{border-radius:3px 8px 8px 3px}.page h3{margin:0 0 22px;font-family:Georgia,"Noto Serif KR",serif;font-size:24px}.page p{font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(16px,2.2vw,21px);line-height:1.85;margin:0;white-space:pre-line}.pageNo{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;opacity:.55}.turnPage{position:absolute;right:13px;top:13px;bottom:13px;width:calc(50% - 13px);transform-origin:left center;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.75,.22,1);z-index:8}.turnPage.dragging{transition:none}.turnFace{position:absolute;inset:0;backface-visibility:hidden;background:linear-gradient(90deg,#fdf4df,#f1e5cd);color:#2a241d;padding:44px 42px;box-shadow:-8px 0 18px rgba(85,58,28,.13)}.turnBack{transform:rotateY(180deg);background:linear-gradient(90deg,#e9dcc2,#fcf4e1)}.cornerHint{position:absolute;right:18px;bottom:18px;background:rgba(45,36,25,.68);color:white;padding:8px 11px;border-radius:999px;font-size:12px;z-index:20}.bookTop{position:absolute;top:-48px;left:0;right:0;display:flex;justify-content:space-between;align-items:center}.closeBook{border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;width:38px;height:38px;border-radius:50%}#toast{position:absolute;left:50%;bottom:135px;transform:translateX(-50%);padding:10px 14px;border-radius:999px;display:none}@media(max-width:700px){.topbar{top:12px;left:12px;right:12px}.pill{padding:9px 12px;font-size:12px}#bottomActions{bottom:18px}#joystick{bottom:18px;left:14px;width:92px;height:92px}#joyKnob{left:30px;top:30px;width:32px;height:32px}.action{min-width:62px;padding:9px 10px;font-size:12px}.card{padding:20px}.avatarPreview{height:150px}.head{top:22px}.bookWrap{height:63vh}.page{padding:30px 22px}.turnFace{padding:30px 22px}}
</style>
</head>
<body>
<div id="app"><canvas id="scene"></canvas><div id="hud"><div class="topbar"><div class="pill glass"><span>✝</span><span class="brand">임마누웰</span><span class="muted">| 기도정원 52</span></div><div class="actions-top"><div class="pill glass">👥 <b id="onlineCount">48</b></div><button class="iconbtn">♫</button><button class="iconbtn">⚙</button></div></div><div id="hint" class="glass">정원에서 천천히 걸어보세요</div><div id="joystick" class="glass"><div id="joyKnob"></div></div><div id="bottomActions" class="glass"><button class="action" id="prayBtn">🙏<br>기도</button><button class="action" id="bibleBtn">📖<br>말씀</button><button class="action" id="sitBtn">🪑<br>앉기</button></div><div id="toast" class="glass"></div></div><div id="selector" class="panel"><div class="card glass"><h1>당신의 모습을 골라주세요</h1><p>이곳에서는 이름을 말하지 않아도 괜찮아요.</p><div class="choiceRow"><button class="charChoice selected" data-gender="male"><div class="avatarPreview"><div class="hair male"></div><div class="head"></div><div class="body"></div><div class="legs"></div></div><b>남자</b></button><button class="charChoice" data-gender="female"><div class="avatarPreview"><div class="hair female"></div><div class="head"></div><div class="body"></div><div class="legs"></div></div><b>여자</b></button></div><div class="paletteTitle">옷 색상을 선택하세요</div><div class="palette" id="palette"></div><button class="enter" id="enterBtn">기도정원에 들어가기 →</button></div></div><div id="bibleOverlay"><div class="bookWrap"><div class="bookTop"><div>마태복음 11장</div><button class="closeBook" id="closeBook">×</button></div><div class="bookShadow"></div><div class="book"><div class="page left"><h3>마태복음 11장</h3><p id="leftText"></p><div class="pageNo" id="leftNo"></div></div><div class="page right"><h3>마태복음 11장</h3><p id="rightText"></p><div class="pageNo" id="rightNo"></div></div><div class="turnPage" id="turnPage"><div class="turnFace"><h3>마태복음 11장</h3><p id="turnText"></p></div><div class="turnFace turnBack"></div></div></div><div class="cornerHint">페이지 끝을 왼쪽으로 드래그해 넘겨보세요</div></div></div></div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';
const canvas=document.getElementById('scene');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene();scene.background=new THREE.Color(0x09111a);scene.fog=new THREE.Fog(0x09111a,18,52);const camera=new THREE.PerspectiveCamera(50,1,.1,100);camera.position.set(0,4.1,8);scene.add(new THREE.HemisphereLight(0xa6c6ff,0x2f2416,1.05));const moon=new THREE.DirectionalLight(0xffe5bd,2.8);moon.position.set(-4,9,4);moon.castShadow=true;scene.add(moon);const ground=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color:0x203022,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);for(let z=-25;z<10;z+=2){const stone=new THREE.Mesh(new THREE.BoxGeometry(2.6,.12,1.35),new THREE.MeshStandardMaterial({color:0x6f695d,roughness:1}));stone.position.set(Math.sin(z*.7)*.2,.06,z);stone.rotation.y=Math.sin(z)*.04;scene.add(stone)}const chapel=new THREE.Group(),wallMat=new THREE.MeshStandardMaterial({color:0xb7a78b,roughness:.85}),darkWood=new THREE.MeshStandardMaterial({color:0x3a2418,roughness:.8});const body=new THREE.Mesh(new THREE.BoxGeometry(8,5,6),wallMat);body.position.set(0,2.5,-17);chapel.add(body);const roof=new THREE.Mesh(new THREE.ConeGeometry(6.1,3.2,4),darkWood);roof.position.set(0,6.55,-17);roof.rotation.y=Math.PI/4;roof.scale.z=.72;chapel.add(roof);const door=new THREE.Mesh(new THREE.BoxGeometry(1.6,2.8,.18),darkWood);door.position.set(0,1.4,-13.93);chapel.add(door);const crossMat=new THREE.MeshStandardMaterial({color:0xffd99a,emissive:0x6b3b10,emissiveIntensity:.7}),crossV=new THREE.Mesh(new THREE.BoxGeometry(.25,2.2,.25),crossMat),crossH=new THREE.Mesh(new THREE.BoxGeometry(1.4,.25,.25),crossMat);crossV.position.set(0,8.8,-17);crossH.position.set(0,9.25,-17);chapel.add(crossV,crossH);scene.add(chapel);const lanternMat=new THREE.MeshStandardMaterial({color:0xffdf9f,emissive:0xffa536,emissiveIntensity:2});for(let z=-22;z<7;z+=4)for(const x of[-3.6,3.6]){const post=new THREE.Mesh(new THREE.CylinderGeometry(.08,.1,1.3,8),darkWood);post.position.set(x,.65,z);scene.add(post);const lamp=new THREE.Mesh(new THREE.BoxGeometry(.34,.46,.34),lanternMat);lamp.position.set(x,1.42,z);scene.add(lamp);const pl=new THREE.PointLight(0xffb35c,1.8,5);pl.position.set(x,1.5,z);scene.add(pl)}function addTree(x,z,s=1){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,2.1,8),darkWood);trunk.position.set(x,1.05,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.25*s,10,8),new THREE.MeshStandardMaterial({color:0x244f2a,roughness:1}));crown.scale.y=1.35;crown.position.set(x,2.7,z);scene.add(crown)}[[-6,-4,1.1],[6,-6,1.2],[-7,-12,1.3],[7,-16,1.2],[-5,-22,1],[5,-24,1]].forEach(t=>addTree(...t));const avatars=[];function makeAvatar(color=0xeee2cf,female=false,x=0,z=0){const g=new THREE.Group(),skin=new THREE.MeshStandardMaterial({color:0xa86f49}),cloth=new THREE.MeshStandardMaterial({color}),hairMat=new THREE.MeshStandardMaterial({color:0x39251d});const head=new THREE.Mesh(new THREE.SphereGeometry(.43,20,16),skin);head.position.y=1.55;g.add(head);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.46,.65,6,12),cloth);torso.position.y=.82;g.add(torso);const legMat=new THREE.MeshStandardMaterial({color:0x4d514c});for(const dx of[-.19,.19]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.35,5,10),legMat);leg.position.set(dx,.25,0);g.add(leg)}if(female){const hair=new THREE.Mesh(new THREE.SphereGeometry(.48,18,14),hairMat);hair.scale.set(1.05,1.15,.9);hair.position.set(0,1.57,.04);g.add(hair);head.position.z=-.18}else{const hair=new THREE.Mesh(new THREE.SphereGeometry(.46,18,10,0,Math.PI*2,0,Math.PI/2),hairMat);hair.position.set(0,1.73,0);g.add(hair)}g.position.set(x,0,z);scene.add(g);avatars.push(g);return g}let gender='male',cloth=0xeee2cf,player=null,praying=false,sitting=false;const palettes={male:[0xeee2cf,0x66806b,0x30496b],female:[0xeee2cf,0xc98582,0x93afc5]};function rebuildPalette(){const p=document.getElementById('palette');p.innerHTML='';palettes[gender].forEach((c,i)=>{const s=document.createElement('button');s.className='swatch'+(i===0?' selected':'');s.style.background='#'+c.toString(16).padStart(6,'0');s.onclick=()=>{cloth=c;[...p.children].forEach(x=>x.classList.remove('selected'));s.classList.add('selected')};p.appendChild(s)});cloth=palettes[gender][0]}rebuildPalette();document.querySelectorAll('.charChoice').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.charChoice').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');gender=btn.dataset.gender;rebuildPalette()});document.getElementById('enterBtn').onclick=()=>{document.getElementById('selector').style.display='none';player=makeAvatar(cloth,gender==='female',0,3.2);const cols=[0xe8dfcf,0x6f866f,0x38506d,0xc88d89,0x9fb9c9];for(let i=0;i<18;i++)makeAvatar(cols[i%cols.length],i%2===0,(Math.random()-.5)*10,-4-Math.random()*19);camera.position.set(0,4.2,8)};const joy=document.getElementById('joystick'),knob=document.getElementById('joyKnob');let joyVec={x:0,y:0},activePointer=null;function updateJoy(e){const r=joy.getBoundingClientRect();let x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);const max=r.width*.31,d=Math.hypot(x,y)||1;if(d>max){x=x/d*max;y=y/d*max}joyVec={x:x/max,y:y/max};knob.style.transform=`translate(${x}px,${y}px)`}joy.addEventListener('pointerdown',e=>{activePointer=e.pointerId;joy.setPointerCapture(e.pointerId);updateJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===activePointer)updateJoy(e)});function resetJoy(){joyVec={x:0,y:0};knob.style.transform='';activePointer=null}joy.addEventListener('pointerup',resetJoy);joy.addEventListener('pointercancel',resetJoy);const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',1800)}document.getElementById('prayBtn').onclick=()=>{if(!player)return;praying=!praying;sitting=false;player.scale.y=praying?.86:1;player.position.y=praying?-.06:0;toast(praying?'조용히 기도하는 중입니다.':'기도를 마쳤습니다.')};document.getElementById('sitBtn').onclick=()=>{if(!player)return;sitting=!sitting;praying=false;player.scale.y=sitting?.72:1;player.position.y=sitting?-.15:0;toast(sitting?'잠시 앉아 머뭅니다.':'다시 일어났습니다.')};const scripturePages=["28 수고하고 무거운 짐 진 자들아 다 내게로 오라\n내가 너희를 쉬게 하리라.\n\n29 나는 마음이 온유하고 겸손하니 나의 멍에를 메고 내게 배우라.","30 이는 내 멍에는 쉽고 내 짐은 가벼움이라 하시니라.\n\n오늘도 말씀 앞에서 잠시 머물러 보세요.","1 예수께서 열두 제자에게 명하기를 마치시고 이에 그들의 여러 동네에서 가르치시며 전도하시려고 거기를 떠나 가시니라.","2 요한이 옥에서 그리스도께서 하신 일을 듣고 제자들을 보내어 예수께 여짜오되 오실 그이가 당신이오니이까."];let pageIndex=0;function renderBible(){leftText.textContent=scripturePages[pageIndex%scripturePages.length];rightText.textContent=scripturePages[(pageIndex+1)%scripturePages.length];turnText.textContent=scripturePages[(pageIndex+1)%scripturePages.length];leftNo.textContent=pageIndex+1;rightNo.textContent=pageIndex+2}renderBible();const overlay=document.getElementById('bibleOverlay'),turn=document.getElementById('turnPage');document.getElementById('bibleBtn').onclick=()=>{overlay.style.display='flex';renderBible()};document.getElementById('closeBook').onclick=()=>overlay.style.display='none';let drag=null;turn.addEventListener('pointerdown',e=>{drag={start:e.clientX};turn.setPointerCapture(e.pointerId);turn.classList.add('dragging')});turn.addEventListener('pointermove',e=>{if(!drag)return;const w=turn.getBoundingClientRect().width,dx=Math.min(0,e.clientX-drag.start),deg=Math.max(-178,dx/w*180);turn.style.transform=`rotateY(${deg}deg)`});turn.addEventListener('pointerup',e=>{if(!drag)return;const w=turn.getBoundingClientRect().width,dx=e.clientX-drag.start;turn.classList.remove('dragging');if(dx<-w*.35){turn.style.transform='rotateY(-180deg)';setTimeout(()=>{pageIndex=(pageIndex+2)%scripturePages.length;turn.style.transition='none';turn.style.transform='rotateY(0deg)';renderBible();requestAnimationFrame(()=>requestAnimationFrame(()=>turn.style.transition=''))},500)}else turn.style.transform='rotateY(0deg)';drag=null});function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033);if(player&&!praying&&!sitting){let mx=joyVec.x+(keys.d?1:0)-(keys.a?1:0),mz=joyVec.y+(keys.s?1:0)-(keys.w?1:0),len=Math.hypot(mx,mz);if(len>.05){mx/=Math.max(1,len);mz/=Math.max(1,len);player.position.x+=mx*3*dt;player.position.z+=mz*3*dt;player.position.x=THREE.MathUtils.clamp(player.position.x,-8,8);player.position.z=THREE.MathUtils.clamp(player.position.z,-11,7);player.rotation.y=Math.atan2(mx,mz);player.position.y=Math.abs(Math.sin(performance.now()*.009))*.045}else player.position.y=0;camera.position.x+=(player.position.x-camera.position.x)*.055;camera.position.z+=(player.position.z+5.1-camera.position.z)*.055;camera.lookAt(player.position.x,1,player.position.z-2.8)}renderer.render(scene,camera)}animate();
</script>
