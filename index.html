<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>임마누웰 | 온라인 기도정원</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,"Pretendard","Noto Sans KR",sans-serif;color:#fff}button{font:inherit}.hidden{display:none!important}
#app{position:fixed;inset:0;background:#111;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:linear-gradient(180deg,rgba(9,14,18,.08),rgba(9,12,15,.42)),url('assets/main-reference.jpg') center/cover no-repeat}.panel{width:min(560px,92vw);padding:34px;border-radius:26px;background:rgba(17,18,20,.52);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(15px);box-shadow:0 28px 80px rgba(0,0,0,.42);text-align:center}.panel h1{font-family:Georgia,"Noto Serif KR",serif;font-weight:500;font-size:clamp(46px,8vw,92px);margin:0 0 4px}.panel h2{margin:0 0 8px;font-size:30px}.panel p{line-height:1.8;opacity:.88}.primary{border:0;border-radius:999px;padding:15px 34px;background:#f5e5c2;color:#2a2119;font-weight:800;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}.choice{border:1px solid rgba(255,255,255,.18);border-radius:20px;background:rgba(255,255,255,.06);color:#fff;padding:18px;cursor:pointer}.choice.selected{outline:2px solid #f2d79e;background:rgba(242,215,158,.13)}.avatarIcon{width:92px;height:128px;margin:0 auto 10px;position:relative}.head{position:absolute;top:6px;left:20px;width:52px;height:52px;border-radius:50%;background:#d1a17b}.body{position:absolute;left:12px;bottom:0;width:68px;height:78px;border-radius:34px 34px 20px 20px;background:#e9dfcf}.hairM{position:absolute;top:0;left:17px;width:58px;height:28px;border-radius:50% 50% 35% 35%;background:#3c2a22;z-index:3}.hairF{position:absolute;top:0;left:14px;width:64px;height:70px;border-radius:50% 50% 42% 42%;background:#4a3329;z-index:0}.palette{display:flex;gap:12px;justify-content:center;margin:14px 0 22px}.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.45);cursor:pointer}.sw.selected{outline:3px solid #fff;outline-offset:3px}
#garden{position:absolute;inset:0;overflow:hidden;background:#151515}.scene{position:absolute;inset:-2.5%;background-image:url('assets/main-reference.jpg');background-position:center;background-size:cover;background-repeat:no-repeat;transform:scale(1.055);transition:transform .08s linear,background-position .08s linear;will-change:transform,background-position}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,18,.02),rgba(10,12,13,.08) 62%,rgba(0,0,0,.18));pointer-events:none}
#hotspots{position:absolute;inset:0;z-index:5}.hot{position:absolute;background:transparent;border:0;cursor:pointer;border-radius:24px}.hot:focus-visible{outline:2px solid #fff}.hot.pray{left:61%;bottom:4%;width:13%;height:22%}.hot.bible{left:74%;bottom:4%;width:13%;height:22%}.hot.sit{left:87%;bottom:4%;width:11%;height:22%}.hot.chapel{left:66%;top:13%;width:28%;height:42%}.hot.menu1{left:6%;top:38%;width:18%;height:7%}.hot.menu2{left:6%;top:45%;width:18%;height:7%}.hot.menu3{left:6%;top:52%;width:18%;height:7%}.hot.menu4{left:6%;top:59%;width:18%;height:7%}.hot.music{right:12%;top:3%;width:7%;height:10%}.hot.settings{right:3%;top:3%;width:7%;height:10%}
#toast{position:absolute;left:50%;bottom:8%;z-index:12;transform:translateX(-50%) translateY(16px);padding:11px 18px;border-radius:999px;background:rgba(18,18,18,.74);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:.25s}.showToast{opacity:1!important;transform:translateX(-50%) translateY(0)!important}
#bibleModal{position:absolute;inset:0;z-index:40;background:rgba(5,5,6,.72);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:24px}.bookWrap{width:min(940px,94vw);height:min(560px,72vh);position:relative;perspective:1600px}.close{position:absolute;right:0;top:-48px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;cursor:pointer}.book{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;background:#6f4e34;padding:12px;border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.55)}.page{padding:44px 38px;color:#34291e;background:linear-gradient(90deg,#eee0c7,#fffaf0 14%,#fff9ec 88%,#ead6b5);font-family:Georgia,"Noto Serif KR",serif;line-height:1.9;font-size:18px}.page:first-child{border-radius:9px 2px 2px 9px;border-right:1px solid #d0b88d}.page:last-child{border-radius:2px 9px 9px 2px}.page small{display:block;margin-top:30px;color:#796754}
#prayerModal{position:absolute;inset:0;z-index:39;background:rgba(5,5,6,.64);backdrop-filter:blur(9px);display:flex;align-items:center;justify-content:center}.prayerCard{width:min(520px,90vw);padding:28px;border-radius:24px;background:rgba(31,27,24,.9);border:1px solid rgba(255,255,255,.18);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.45)}.prayerCard h3{margin-top:0;font-size:28px}.prayerCard textarea{width:100%;height:140px;resize:none;border:1px solid rgba(255,255,255,.13);border-radius:16px;background:rgba(255,255,255,.06);color:#fff;padding:15px;outline:none}.row{display:flex;gap:10px;justify-content:center;margin-top:16px}.ghost{border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;border-radius:999px;padding:12px 22px;cursor:pointer}
@media(max-width:760px){.panel{padding:24px}.panel h1{font-size:52px}.scene{inset:-6%;transform:scale(1.12);background-position:58% center}.hot.pray{left:50%;bottom:3%;width:17%}.hot.bible{left:67%;bottom:3%;width:17%}.hot.sit{left:84%;bottom:3%;width:15%}.hot.chapel{left:59%;top:13%;width:38%;height:42%}.hot.menu1,.hot.menu2,.hot.menu3,.hot.menu4{left:3%;width:27%}.bookWrap{height:62vh}.page{font-size:14px;padding:26px 18px}}
</style>
</head>
<body>
<div id="app">
  <section id="title" class="screen">
    <div class="panel">
      <div style="font-size:17px;letter-spacing:.08em">오늘도 당신 곁에</div>
      <h1>임마누웰</h1>
      <div style="letter-spacing:.08em;margin-bottom:20px">ImmanuWell</div>
      <p>이곳은 함께 기도하며<br>잠시 머무는 온라인 기도정원입니다.</p>
      <button id="start" class="primary">정원에 들어가기 →</button>
    </div>
  </section>

  <section id="selector" class="screen hidden">
    <div class="panel">
      <h2>당신의 모습을 골라주세요</h2>
      <p>이곳에서는 이름을 말하지 않아도 괜찮아요.</p>
      <div class="choices">
        <button class="choice selected" data-gender="male"><div class="avatarIcon"><div class="hairM"></div><div class="head"></div><div class="body"></div></div><b>남자</b></button>
        <button class="choice" data-gender="female"><div class="avatarIcon"><div class="hairF"></div><div class="head"></div><div class="body"></div></div><b>여자</b></button>
      </div>
      <div class="palette"><button class="sw selected" style="background:#e9dfcf"></button><button class="sw" style="background:#93a58d"></button><button class="sw" style="background:#b9857a"></button></div>
      <button id="enter" class="primary">정원에 들어가기 →</button>
    </div>
  </section>

  <main id="garden" class="hidden">
    <div id="scene" class="scene"></div>
    <div id="hotspots">
      <button class="hot pray" aria-label="기도하기"></button>
      <button class="hot bible" aria-label="말씀 보기"></button>
      <button class="hot sit" aria-label="앉기"></button>
      <button class="hot chapel" aria-label="예배당"></button>
      <button class="hot menu1" aria-label="예배당"></button>
      <button class="hot menu2" aria-label="기도의 언덕"></button>
      <button class="hot menu3" aria-label="시냇가"></button>
      <button class="hot menu4" aria-label="십자가의 길"></button>
      <button class="hot music" aria-label="음악"></button>
      <button class="hot settings" aria-label="설정"></button>
    </div>
    <div id="toast"></div>
  </main>

  <div id="bibleModal" class="hidden">
    <div class="bookWrap">
      <button id="closeBible" class="close">×</button>
      <div class="book">
        <div class="page"><h3>오늘의 말씀</h3><p>수고하고 무거운 짐 진 자들아<br>다 내게로 오라.<br><br>내가 너희를 쉬게 하리라.</p><small>마태복음 11:28</small></div>
        <div class="page"><h3>잠시 머물러 보세요</h3><p>말씀을 천천히 읽고<br>마음에 머무는 한 문장을<br>조용히 되새겨 보세요.</p></div>
      </div>
    </div>
  </div>

  <div id="prayerModal" class="hidden">
    <div class="prayerCard">
      <h3>기도하기</h3>
      <p style="opacity:.78">지금 마음에 있는 기도를 조용히 적어보세요.</p>
      <textarea placeholder="기도 내용을 적어주세요"></textarea>
      <div class="row"><button id="closePrayer" class="ghost">닫기</button><button id="savePrayer" class="primary">기도 남기기</button></div>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
$('#start').onclick=()=>{$('#title').classList.add('hidden');$('#selector').classList.remove('hidden')};
$$('.choice').forEach(b=>b.onclick=()=>{$$('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
$$('.sw').forEach(b=>b.onclick=()=>{$$('.sw').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
$('#enter').onclick=()=>{$('#selector').classList.add('hidden');$('#garden').classList.remove('hidden')};
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('showToast');clearTimeout(window.__tt);window.__tt=setTimeout(()=>el.classList.remove('showToast'),1500)}
$('.hot.pray').onclick=()=>$('#prayerModal').classList.remove('hidden');
$('.hot.bible').onclick=()=>$('#bibleModal').classList.remove('hidden');
$('.hot.sit').onclick=()=>toast('조용히 자리에 앉았습니다.');
$('.hot.chapel').onclick=()=>toast('예배당 내부 장면은 다음 단계에서 연결합니다.');
$('.hot.menu1').onclick=()=>toast('예배당');$('.hot.menu2').onclick=()=>toast('기도의 언덕');$('.hot.menu3').onclick=()=>toast('시냇가');$('.hot.menu4').onclick=()=>toast('십자가의 길');
$('.hot.music').onclick=()=>toast('배경음악 준비 중');$('.hot.settings').onclick=()=>toast('설정');
$('#closeBible').onclick=()=>$('#bibleModal').classList.add('hidden');
$('#closePrayer').onclick=()=>$('#prayerModal').classList.add('hidden');
$('#savePrayer').onclick=()=>{$('#prayerModal').classList.add('hidden');toast('기도를 조용히 남겼습니다.')};
const scene=$('#scene');let baseX=50,baseY=50;$('#garden').addEventListener('pointermove',e=>{if(innerWidth<760)return;const x=(e.clientX/innerWidth-.5)*2;const y=(e.clientY/innerHeight-.5)*2;scene.style.backgroundPosition=`${50+x*1.2}% ${50+y*.7}%`;scene.style.transform=`scale(1.065) translate(${-x*3}px,${-y*2}px)`});$('#garden').addEventListener('pointerleave',()=>{scene.style.backgroundPosition='center';scene.style.transform='scale(1.055)'});
</script>
</body>
</html>
