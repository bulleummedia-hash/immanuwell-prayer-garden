<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>임마누웰 | 온라인 기도정원</title><style>:root{--glass:rgba(29,24,20,.62);--line:rgba(255,255,255,.22);--gold:#d7a45b}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#1b1b1b;color:#fff;font-family:system-ui,-apple-system,"Pretendard","Noto Sans KR",sans-serif}button{font:inherit}.screen{position:absolute;inset:0}.hidden{display:none!important}#title,#selector,#garden{background-position:center;background-size:cover;background-repeat:no-repeat}#title{background-image:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.32)),url('https://d3fphkxyf5o5bm.cloudfront.net/image-resize/format%3Dwebp%2Cw%3D1200/QwRY54Li1HMwD7oNfpzVczl3ZisuuSAUgnnUnO8R1T');display:flex;align-items:center;justify-content:center;text-align:center}#title:before,#selector:before,#garden:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 60% 30%,transparent 0 45%,rgba(0,0,0,.22) 100%);pointer-events:none}.hero{position:relative;z-index:2;text-shadow:0 4px 24px rgba(0,0,0,.65)}.hero small{font-size:18px;letter-spacing:.06em}.hero h1{font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(54px,9vw,108px);font-weight:500;margin:12px 0 2px}.hero .eng{font-size:18px;letter-spacing:.08em}.hero p{line-height:1.9;margin:28px 0}.primary{border:0;border-radius:999px;padding:16px 42px;min-width:280px;background:#fff8e8;color:#2f261e;font-weight:800;box-shadow:0 14px 38px rgba(0,0,0,.35)}#selector{background-image:linear-gradient(rgba(10,9,8,.55),rgba(10,9,8,.62)),url('https://d3fphkxyf5o5bm.cloudfront.net/image-resize/format%3Dwebp%2Cw%3D1200/QwRY54Li1HMwD7oNfpzVczl3ZisuuSAUgnnUnO8R1T');display:flex;align-items:center;justify-content:center;padding:24px}.selectorCard{position:relative;z-index:2;width:min(760px,96vw);padding:26px;border-radius:26px;background:rgba(20,17,14,.48);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px)}.selectorCard h2{text-align:center;margin:0 0 8px}.selectorCard>p{text-align:center;opacity:.8;margin:0 0 20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px}.choice{border:1px solid rgba(255,255,255,.22);border-radius:22px;background:rgba(255,255,255,.035);color:#fff;padding:18px}.choice.selected{box-shadow:0 0 0 2px #e9c58e inset}.avatarPreview{height:180px;position:relative}.head{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;background:#b98564}.hairM,.hairF{position:absolute;left:50%;transform:translateX(-50%);background:#3a2a24}.hairM{top:17px;width:76px;height:38px;border-radius:50% 50% 36% 36%}.hairF{top:16px;width:82px;height:84px;border-radius:50%}.body{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);width:88px;height:96px;border-radius:40px 40px 26px 26px;background:#eee6d8}.palette{display:flex;gap:12px;justify-content:center;margin:18px 0}.swatch{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.3)}.swatch.selected{outline:3px solid #fff;outline-offset:3px}#garden{background-image:linear-gradient(180deg,rgba(3,7,12,.02),rgba(10,8,5,.12)),url('https://d3fphkxyf5o5bm.cloudfront.net/image-resize/format%3Dwebp%2Cw%3D1200/QwRY54Li1HMwD7oNfpzVczl3ZisuuSAUgnnUnO8R1T');overflow:hidden}#world{position:absolute;inset:-3%;transform:scale(1.06);transition:transform .18s ease-out;background:linear-gradient(180deg,transparent 0 52%,rgba(28,20,13,.12) 100%)}.count{position:absolute;top:22px;left:22px;padding:11px 16px;border-radius:13px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);z-index:5}.topicons{position:absolute;top:20px;right:22px;display:flex;gap:9px;z-index:5}.circle{width:47px;height:47px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:#fff;backdrop-filter:blur(12px)}.places{position:absolute;left:26px;top:30%;display:flex;flex-direction:column;gap:8px;z-index:5}.place{min-width:150px;text-align:left;padding:10px 14px;border-radius:8px;border:1px solid rgba(79,49,24,.5);background:linear-gradient(#c89b61,#a87540);color:#24180f;box-shadow:0 4px 12px rgba(0,0,0,.28);font-weight:700}.actions{position:absolute;right:28px;bottom:22px;display:flex;gap:12px;z-index:5}.action{width:92px;height:92px;border-radius:50%;border:1px solid rgba(255,255,255,.33);background:rgba(36,30,25,.60);color:#fff;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.3)}.action strong{display:block;font-size:27px;margin-bottom:5px}.action.pray{box-shadow:0 0 0 2px rgba(233,194,128,.74),0 0 28px rgba(255,183,74,.22)}.joystick{position:absolute;left:24px;bottom:25px;width:104px;height:104px;border-radius:50%;background:rgba(35,31,27,.5);border:1px solid var(--line);z-index:5}.joystick:after{content:"";position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.72);left:31px;top:31px}.player{position:absolute;left:55%;bottom:9%;width:84px;height:132px;z-index:4;transition:left 1.3s cubic-bezier(.22,.8,.25,1),bottom 1.3s cubic-bezier(.22,.8,.25,1),transform .3s}.player .ph{position:absolute;left:16px;top:0;width:52px;height:52px;border-radius:50%;background:#bd8d6c;box-shadow:inset 0 -8px 14px rgba(0,0,0,.12)}.player .pb{position:absolute;left:9px;top:45px;width:66px;height:78px;border-radius:30px 30px 22px 22px;background:#eadfd2}.player .pl1,.player .pl2{position:absolute;bottom:0;width:22px;height:34px;border-radius:12px;background:#d4c8ba}.player .pl1{left:16px}.player .pl2{right:16px}.npc{position:absolute;width:42px;height:62px;opacity:.95;z-index:3}.npc:before{content:"";position:absolute;left:8px;top:0;width:26px;height:26px;border-radius:50%;background:#bd8b69}.npc:after{content:"";position:absolute;left:5px;top:21px;width:32px;height:39px;border-radius:16px;background:#d8cdbd}.n1{left:42%;bottom:38%;transform:scale(.8)}.n2{left:48%;bottom:41%;transform:scale(.72)}.n3{left:68%;bottom:36%;transform:scale(.76)}.n4{left:82%;bottom:31%;transform:scale(.82)}#bible{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(5,6,7,.7);backdrop-filter:blur(12px)}.book{width:min(850px,90vw);height:min(540px,68vh);background:#5f3e29;border-radius:16px;padding:14px;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 40px 90px rgba(0,0,0,.6);position:relative}.page{background:linear-gradient(90deg,#eadcc0,#fff8e7 14%,#fff9e9 86%,#e3d1b1);color:#34291e;padding:42px 34px;font-family:Georgia,"Noto Serif KR",serif;line-height:1.9}.page:first-child{border-radius:9px 2px 2px 9px}.page:nth-child(2){border-radius:2px 9px 9px 2px}.close{position:absolute;right:-12px;top:-52px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff}.toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);padding:10px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);z-index:8}.hidden2{display:none}@media(max-width:720px){.places{left:10px;top:25%}.place{min-width:115px;font-size:12px;padding:8px 10px}.actions{right:10px;bottom:12px;gap:7px}.action{width:68px;height:68px;font-size:10px}.action strong{font-size:20px}.joystick{left:10px;bottom:12px;width:86px;height:86px}.joystick:after{width:32px;height:32px;left:26px;top:26px}.count{top:10px;left:10px;font-size:12px}.topicons{top:10px;right:10px}.circle{width:42px;height:42px}.player{transform:scale(.82);transform-origin:bottom center}}</style></head><body><div id="title" class="screen"><div class="hero"><small>오늘도 당신 곁에</small><h1>임마누웰</h1><div class="eng">ImmanuWell</div><p>이곳은 함께 기도하며<br>잠시 머무는 온라인 기도정원입니다.</p><button id="start" class="primary">정원에 들어가기 →</button></div></div><div id="selector" class="screen hidden"><div class="selectorCard"><h2>당신의 모습을 골라주세요</h2><p>이곳에서는 이름을 말하지 않아도 괜찮아요.</p><div class="choices"><button class="choice selected" data-g="male"><div class="avatarPreview"><div class="hairM"></div><div class="head"></div><div class="body"></div></div><b>남자</b></button><button class="choice" data-g="female"><div class="avatarPreview"><div class="hairF"></div><div class="head"></div><div class="body"></div></div><b>여자</b></button></div><div class="palette" id="palette"></div><button id="enter" class="primary" style="display:block;margin:auto">정원에 들어가기 →</button></div></div><div id="garden" class="screen hidden"><div id="world"><div class="npc n1"></div><div class="npc n2"></div><div class="npc n3"></div><div class="npc n4"></div><div id="player" class="player"><div class="ph"></div><div class="pb"></div><div class="pl1"></div><div class="pl2"></div></div></div><div class="count">👤 &nbsp;<b>52명</b>이 함께 머물고 있어요</div><div class="topicons"><button class="circle">♫</button><button id="topBible" class="circle">▣</button><button class="circle">⚙</button></div><div class="places"><button class="place" data-pos="55,9">예배당 →</button><button class="place" data-pos="42,20">기도의 언덕 →</button><button class="place" data-pos="31,16">시냇가 →</button><button class="place" data-pos="63,18">십자가의 길 →</button><button class="place" data-pos="76,14">전망 쉼터 →</button></div><div class="joystick"></div><div class="actions"><button id="pray" class="action pray"><strong>🙏</strong>기도하기</button><button id="bibleBtn" class="action"><strong>📖</strong>말씀 보기</button><button id="sit" class="action"><strong>♨</strong>앉기</button></div><div id="toast" class="toast hidden2"></div></div><div id="bible"><div class="book"><button id="closeBook" class="close">×</button><div class="page"><h3>마태복음 11장</h3><p>수고하고 무거운 짐 진 자들아<br>다 내게로 오라.<br><br>내가 너희를 쉬게 하리라.</p></div><div class="page"><h3>잠시 머물러 보세요</h3><p>말씀을 천천히 읽고<br>마음에 머무는 한 문장을<br>조용히 되새겨 보세요.</p></div></div></div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const title=$('#title'),selector=$('#selector'),garden=$('#garden'),player=$('#player'),world=$('#world'),toast=$('#toast');let gender='male',color='#eadfd2',drag=false,sx=0,sy=0,px=0,py=0;const palettes={male:['#eee6d9','#758576','#3f5879'],female:['#eee4d7','#c8958d','#9eacc4']};function renderPalette(){const p=$('#palette');p.innerHTML='';palettes[gender].forEach((c,i)=>{const b=document.createElement('button');b.className='swatch'+(i===0?' selected':'');b.style.background=c;b.onclick=()=>{color=c;$$('.swatch').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};p.appendChild(b)});color=palettes[gender][0]}renderPalette();$('#start').onclick=()=>{title.classList.add('hidden');selector.classList.remove('hidden')};$$('.choice').forEach(b=>b.onclick=()=>{$$('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');gender=b.dataset.g;renderPalette()});$('#enter').onclick=()=>{selector.classList.add('hidden');garden.classList.remove('hidden');player.querySelector('.pb').style.background=color};function say(t){toast.textContent=t;toast.classList.remove('hidden2');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.add('hidden2'),1500)}$$('.place').forEach(b=>b.onclick=()=>{const [x,y]=b.dataset.pos.split(',');player.style.left=x+'%';player.style.bottom=y+'%';say(b.textContent.replace(' →',''))});garden.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag=true;sx=e.clientX;sy=e.clientY;px=0;py=0});garden.addEventListener('pointermove',e=>{if(!drag)return;px=(e.clientX-sx)*.025;py=(e.clientY-sy)*.015;world.style.transform=`scale(1.08) translate(${px}px,${py}px)`});garden.addEventListener('pointerup',e=>{if(!drag)return;const dist=Math.hypot(e.clientX-sx,e.clientY-sy);drag=false;if(dist<8){const r=garden.getBoundingClientRect();const x=((e.clientX-r.left)/r.width)*100,y=100-((e.clientY-r.top)/r.height)*100;player.style.left=Math.max(18,Math.min(82,x))+'%';player.style.bottom=Math.max(7,Math.min(32,y))+'%';say('이동합니다.')}});garden.addEventListener('wheel',e=>{e.preventDefault();const scale=e.deltaY<0?1.11:1.05;world.style.transform=`scale(${scale}) translate(${px}px,${py}px)`},{passive:false});$('#pray').onclick=()=>{player.style.transform='scale(.9) translateY(8px)';say('잠시 마음을 하나님께 드립니다.')};$('#sit').onclick=()=>{player.style.transform='scale(.86) translateY(14px)';say('조용히 앉아 머뭅니다.')};function openBible(){document.getElementById('bible').style.display='flex'}$('#bibleBtn').onclick=openBible;$('#topBible').onclick=openBible;$('#closeBook').onclick=()=>document.getElementById('bible').style.display='none';</script></body></html>
